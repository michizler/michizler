# "More work" rows: one linked graphic per project
more_work:
  - slug: usb
    title: "US Bancorp volatility"
    repo: https://github.com/michizler/usb-stock-timeseries-model
    text: "Holt-Winters and ARIMA failed Ljung-Box. ARIMA(1,0,1) + sGARCH(1,1) passed (p = 0.2369) and gives a 365-day price and volatility forecast from 11,835 daily prices."
    items: [R, forecast, rugarch]
  - slug: strataforge
    title: "StrataForge"
    repo: https://github.com/michizler/strataforge-prediction
    text: "Multiple regression for concrete strength (R² 81.35%, all five assumptions tested), turned into a worked £21,600 saving on a 2,000 m³ project."
    items: [R, Hypothesis testing]
  - slug: reder
    title: "Reder churn"
    repo: https://github.com/michizler/reder-analytics
    text: "Flattens nine nested JSON columns into a 12,483 × 55 table, adds RFM features, selects by mutual information and serves the model through FastAPI."
    items: [Python, scikit-learn, FastAPI]
  - slug: databricks
    title: "Databricks big data"
    repo: https://github.com/michizler/data-science-projects/tree/master/databricks-bigdata-analytics
    text: "Spark SQL over 572,935 clinical trial records, and an ALS game recommender tuned by grid search and tracked in MLflow."
    items: [Databricks, PySpark, Spark SQL, MLlib, MLflow]
  - slug: sql
    title: "SQL Server design"
    repo: https://github.com/michizler/sql-database-projects
    text: "A 9-table 3NF banking database with salted password hashes, procedures and triggers, plus NHS prescribing analysis with window functions and z-score outliers."
    items: [SQL Server, T-SQL]
  - slug: imf
    title: "IMF global economy"
    repo: https://github.com/michizler/imf-globaleconomy-analytics
    text: "A Power BI star schema over 180+ countries and 44 IMF indicators from 2001 to 2020, with custom DAX."
    items: [Power BI, DAX]
